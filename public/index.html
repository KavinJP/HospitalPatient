<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .window-frame {
            width: 650px;
            margin: 0 auto;
            background: #ffffff;
            border: 2px solid #999999;
            padding: 15px;
            box-shadow: 2px 2px 5px #ccc;
        }
        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .grid-panel {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 8px;
            align-items: center;
            border: 1px solid #ccc;
            padding: 12px;
            margin-bottom: 12px;
            background: #fcfcfc;
        }
        .grid-panel label {
            font-size: 13px;
            font-weight: bold;
        }
        .grid-panel input, .grid-panel select {
            padding: 4px 6px;
            font-size: 13px;
            border: 1px solid #aaa;
            width: 95%;
        }
        .button-panel {
            text-align: center;
            margin-bottom: 15px;
        }
        .button-panel button {
            padding: 6px 14px;
            font-size: 13px;
            margin: 0 5px;
            cursor: pointer;
        }
        .table-panel {
            border: 1px solid #ccc;
            padding: 10px;
            background: #fcfcfc;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #aaa;
            padding: 6px 8px;
            text-align: left;
        }
        th {
            background-color: #e5e5e5;
        }
    </style>
</head>
<body>

<div class="window-frame">
    <h2>Library Management System</h2>

    <!-- Grid based frame work -->
    <div class="grid-panel">
        <label>Book ID:</label>
        <input type="text" id="book_id">

        <label>Book Title:</label>
        <input type="text" id="book_title">

        <label>Author Name:</label>
        <input type="text" id="author_name">

        <label>Status:</label>
        <select id="status">
            <option value="Available">Available</option>
            <option value="Issued">Issued</option>
            <option value="Reserved">Reserved</option>
            <option value="Lost">Lost</option>
        </select>
    </div>

    <!-- Exact 3 Buttons -->
    <div class="button-panel">
        <button type="button" onclick="loadBooks()">Load Books</button>
        <button type="button" onclick="searchBook()">Search Book</button>
        <button type="button" onclick="addBook()">Add Book</button>
    </div>

    <!-- JTable web display -->
    <div class="table-panel">
        <table id="bookTable">
            <thead>
                <tr>
                    <th>Book ID</th>
                    <th>Book Title</th>
                    <th>Author Name</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>
</div>

<script>
    // In-memory HashMap representation on client side
    var bookMap = new Map();

    // 1. Load Books
    function loadBooks() {
        fetch('/getBooks')
            .then(res => res.json())
            .then(data => {
                bookMap.clear();
                data.forEach(b => {
                    bookMap.set(b.id, b);
                });
                displayTable();
            })
            .catch(err => {
                // If backend is not reached, load sample records into HashMap
                if (bookMap.size === 0) {
                    bookMap.set('B101', { id: 'B101', title: 'Java Complete Reference', author: 'Herbert Schildt', status: 'Available' });
                    bookMap.set('B102', { id: 'B102', title: 'Clean Code', author: 'Robert C. Martin', status: 'Issued' });
                    bookMap.set('B103', { id: 'B103', title: 'Data Structures', author: 'Mark Weiss', status: 'Reserved' });
                }
                displayTable();
            });
    }

    // 2. Search Book
    function searchBook() {
        var id = document.getElementById('book_id').value.trim();
        if (id === '') {
            alert('Please enter Book ID to search.');
            return;
        }

        // Search the HashMap using Book ID
        if (bookMap.has(id)) {
            var b = bookMap.get(id);
            document.getElementById('book_title').value = b.title;
            document.getElementById('author_name').value = b.author;
            document.getElementById('status').value = b.status;
        } else {
            alert('Book does not exist.');
        }
    }

    // 3. Add Book
    function addBook() {
        var id = document.getElementById('book_id').value.trim();
        var title = document.getElementById('book_title').value.trim();
        var author = document.getElementById('author_name').value.trim();
        var status = document.getElementById('status').value;

        // Validate required fields
        if (id === '' || title === '' || author === '') {
            alert('All fields are required.');
            return;
        }

        // Check if Book ID already exists in HashMap
        if (bookMap.has(id)) {
            alert('Book ID already exists.');
            return;
        }

        var newBook = { id: id, title: title, author: author, status: status };

        // Send to backend (MySQL)
        fetch('/addBook', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newBook)
        })
        .then(() => {
            bookMap.set(id, newBook);
            displayTable();
            clearFields();
        })
        .catch(() => {
            // In-memory fallback
            bookMap.set(id, newBook);
            displayTable();
            clearFields();
        });
    }

    function displayTable() {
        var tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        bookMap.forEach(function(b) {
            var tr = document.createElement('tr');
            tr.innerHTML = '<td>' + b.id + '</td><td>' + b.title + '</td><td>' + b.author + '</td><td>' + b.status + '</td>';
            tbody.appendChild(tr);
        });
    }

    function clearFields() {
        document.getElementById('book_id').value = '';
        document.getElementById('book_title').value = '';
        document.getElementById('author_name').value = '';
        document.getElementById('status').selectedIndex = 0;
    }

    // Initial load
    window.onload = loadBooks;
</script>

</body>
</html>
